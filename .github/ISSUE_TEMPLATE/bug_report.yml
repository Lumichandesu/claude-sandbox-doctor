name: Bug report
description: Something in claude-sandbox-doctor does not work as described
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets, tokens and private paths from anything you paste. The text reports hide the value of a NAME=value that looks like a credential, but the JSON documents hold your settings entries as written.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. For a wrong answer from `why` or a wrong finding from `lint`, paste the few lines of settings that make it happen (the `sandbox` keys, the file they are in) and what Claude Code did with the same call or file (where the command ran, or what `claude doctor` says).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Put this in .claude/settings.json ...
        2. Run claude-sandbox-doctor why "git -C sub status" ...
        3. See ...
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: The output of `claude --version`, or the desktop app's version.
      placeholder: 2.1.301
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where do you run Claude Code?
      options:
        - Terminal
        - Desktop app
        - VS Code
        - JetBrains
        - Web
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Operating system, Node version, and for Linux the distribution and bubblewrap version
      placeholder: "Ubuntu 24.04, Node 22.11, bubblewrap 0.9.0 (node --version, bwrap --version)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - npx from GitHub
        - Claude Code plugin marketplace
        - The toolkit setup page (npx -y github:nrzz/claude-code-toolkit)
        - git clone
        - Other
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: The exact output of the command, with secrets removed. `claude-sandbox-doctor check` shows what this machine offers the sandbox, and `claude-sandbox-doctor check --live` what Claude Code does with it.
      render: text
