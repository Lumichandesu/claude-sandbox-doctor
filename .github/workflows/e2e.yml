name: e2e

# The checks that run the real Claude Code with its Bash sandbox on: what the binary does with a write outside the project and a
# connection to a host that is not allowed, which calls leave the sandbox because of sandbox.excludedCommands (the table of calls
# that `why` is held to), which spellings of an allowed domain match, what it does on a machine that lacks bubblewrap, the bwrap
# command line and the merged-usr layout, managed settings, and that the plugin validates and its skill hands the model the
# report. They cost nothing: Claude Code talks to a fake server on 127.0.0.1. Optional by design: if the binary cannot be
# installed, the checks skip. Weekly, so a Claude Code release that changes how the sandbox decides shows up here. The sandbox
# exists on Linux, WSL2 and macOS only, so there is no Windows job.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Version of @anthropic-ai/claude-code to install (default: the newest)"
        required: false
        default: "latest"

jobs:
  linux:
    name: ubuntu with bubblewrap and socat
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install bubblewrap and socat
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - name: Let bubblewrap create user namespaces (Ubuntu 24.04 restricts them; this is the profile the Claude Code docs give)
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor
          fi
      - name: Install the Claude Code CLI (the checks skip if this fails)
        run: npm install -g @anthropic-ai/claude-code@${{ inputs.claude_version || 'latest' }}
        continue-on-error: true
      - run: claude --version
        continue-on-error: true
      - name: The sandbox, the keys, the bwrap command line, the merged-usr question and the plugin against the real binary
        run: node --test test/e2e-sandbox.test.mjs test/e2e-keys.test.mjs test/e2e-bwrap.test.mjs test/e2e-plugin.test.mjs
        env:
          E2E_CLAUDE: claude
      - name: The table of calls against the real binary
        if: ${{ !cancelled() }}
        run: node --test test/e2e-table.test.mjs
        env:
          E2E_CLAUDE: claude
      - name: The table of domain entries against the real binary
        if: ${{ !cancelled() }}
        run: node --test test/e2e-domains.test.mjs
        env:
          E2E_CLAUDE: claude
      - name: What claude doctor says about sandbox settings
        if: ${{ !cancelled() }}
        run: node --test test/e2e-settings.test.mjs
        env:
          E2E_CLAUDE: claude
      - name: Managed settings (written to /etc/claude-code with sudo, and removed again)
        if: ${{ !cancelled() }}
        run: node --test test/e2e-managed.test.mjs
        env:
          E2E_CLAUDE: claude
          CSD_E2E_MANAGED: "1"
      - name: check --live and check on this machine
        if: ${{ !cancelled() }}
        run: |
          node bin/claude-sandbox-doctor.mjs check || true
          node bin/claude-sandbox-doctor.mjs check --live || true
      - name: The examples of the README (examples/shop and examples/locked copied to ~, no user settings)
        if: ${{ !cancelled() }}
        run: |
          cp -r examples/shop "$HOME/shop"
          cp -r examples/locked "$HOME/locked"
          run() { echo; echo "=== claude-sandbox-doctor $*"; node bin/claude-sandbox-doctor.mjs "$@"; echo "exit=$?"; }
          run show --project "$HOME/shop" || true
          run lint --project "$HOME/shop" || true
          run lint --project "$HOME/shop" --markdown || true
          run check --markdown || true
          run why "docker compose up -d" --project "$HOME/shop" || true
          run why "docker ps" --project "$HOME/shop" || true
          run why "cd infra && terraform plan" --project "$HOME/shop" || true
          run why "npm run build > build.log" --project "$HOME/shop" || true
          run why "npm test" --project "$HOME/shop" --retry || true
          run why "npm test" --project "$HOME/locked" --retry || true
          run why "gh pr list" --project "$HOME/locked" || true
          run why "docker ps" --project "$HOME/shop" --json || true
      - name: The install line of the README (npx from GitHub, at this commit, with a throwaway npm cache and home; may fail without the network)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
          # GitHub serves the tarball of a commit that was pushed a minute ago only after a while; npm then falls back to a clone and stops
          for attempt in 1 2 3 4; do
            npx -y "github:nrzz/claude-sandbox-doctor#${{ github.sha }}" check --markdown && exit 0
            sleep 30
          done
          exit 1

  linux-without:
    name: ubuntu without bubblewrap and socat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Make sure bubblewrap and socat are not installed
        run: |
          sudo apt-get remove -y bubblewrap socat || true
          which bwrap socat || echo "neither is installed"
      - name: Install the Claude Code CLI (the checks skip if this fails)
        run: npm install -g @anthropic-ai/claude-code@${{ inputs.claude_version || 'latest' }}
        continue-on-error: true
      - run: claude --version
        continue-on-error: true
      - name: What the binary does without them, and what check says
        run: node --test test/e2e-nobwrap.test.mjs
        env:
          E2E_CLAUDE: claude
      - name: check on this machine
        if: ${{ !cancelled() }}
        run: node bin/claude-sandbox-doctor.mjs check || true

  macos:
    name: macos with Seatbelt
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the Claude Code CLI (the checks skip if this fails)
        run: npm install -g @anthropic-ai/claude-code@${{ inputs.claude_version || 'latest' }}
        continue-on-error: true
      - run: claude --version
        continue-on-error: true
      - name: The sandbox, the keys and the plugin against the real binary
        run: node --test test/e2e-sandbox.test.mjs test/e2e-keys.test.mjs test/e2e-bwrap.test.mjs test/e2e-plugin.test.mjs
        env:
          E2E_CLAUDE: claude
      - name: The table of calls against the real binary
        if: ${{ !cancelled() }}
        run: node --test test/e2e-table.test.mjs
        env:
          E2E_CLAUDE: claude
      - name: The table of domain entries against the real binary
        if: ${{ !cancelled() }}
        run: node --test test/e2e-domains.test.mjs
        env:
          E2E_CLAUDE: claude
      - name: What claude doctor says about sandbox settings
        if: ${{ !cancelled() }}
        run: node --test test/e2e-settings.test.mjs
        env:
          E2E_CLAUDE: claude
      - name: Managed settings (written to /Library/Application Support/ClaudeCode with sudo, and removed again)
        if: ${{ !cancelled() }}
        run: node --test test/e2e-managed.test.mjs
        env:
          E2E_CLAUDE: claude
          CSD_E2E_MANAGED: "1"
      - name: check --live and check on this machine
        if: ${{ !cancelled() }}
        run: |
          node bin/claude-sandbox-doctor.mjs check || true
          node bin/claude-sandbox-doctor.mjs check --live || true
      - name: The install line of the README (npx from GitHub, at this commit, with a throwaway npm cache and home; may fail without the network)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          export HOME="$(mktemp -d)" npm_config_cache="$(mktemp -d)"
          # GitHub serves the tarball of a commit that was pushed a minute ago only after a while; npm then falls back to a clone and stops
          for attempt in 1 2 3 4; do
            npx -y "github:nrzz/claude-sandbox-doctor#${{ github.sha }}" check --markdown && exit 0
            sleep 30
          done
          exit 1
